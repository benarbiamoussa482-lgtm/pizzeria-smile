<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Smile - القائمة الكاملة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Pizzeria Smile</div>
        <button class="cart-btn" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</button>
    </header>

    <div class="hero">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&q=80&w=800" alt="Pizza">
    </div>

    <!-- هنا سيتم عرض القائمة كاملة -->
    <div id="menu-container"></div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h2>Votre Panier</h2>
            <div id="cart-items"></div>
            <h3 id="cart-total">Total: 0 DA</h3>
            <input type="text" id="client-name" placeholder="الاسم الكريم">
            <input type="text" id="client-address" placeholder="العنوان">
            <button class="btn-whatsapp" onclick="sendWhatsApp()">الطلب عبر الواتساب</button>
            <button onclick="toggleCart()">إغلاق</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
