<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Pizzeria Smile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">PIZZERIA <b>SMILE</b></div>
        <button class="cart-btn" onclick="toggleCart()">🛒 0</button>
    </header>

    <div class="hero">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&q=80&w=800" alt="Pizza">
    </div>

    <!-- البطاقات التي طلبتها -->
    <div class="categories-grid" id="main-grid">
        <div class="cat-card" onclick="renderCategory('Pizzas')">🍕 Pizzas</div>
        <div class="cat-card" onclick="renderCategory('Sandwichs')">🥪 Sandwichs</div>
        <div class="cat-card" onclick="renderCategory('Tacos')">🌮 Tacos</div>
        <div class="cat-card" onclick="renderCategory('Burger')">🍔 Burger</div>
    </div>

    <div class="menu-banner">
        <h2>NOTRE MENU</h2>
        <button class="btn-all" onclick="renderAll()">VOIR TOUT LE MENU</button>
    </div>

    <div id="content-area"></div>

    <script src="script.js"></script>
</body>
</html>
