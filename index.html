<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pizzeria Smile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">PIZZERIA <span>SMILE</span></div>
        <button class="cart-btn" onclick="toggleCart()">🛒 Panier (<span id="cart-count">0</span>)</button>
    </header>

    <div id="menu-container"></div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h2>Votre Panier</h2>
            <div id="cart-items"></div>
            <h3 id="cart-total">Total: 0 DA</h3>
            <input type="text" id="client-name" placeholder="Votre Nom">
            <input type="text" id="client-address" placeholder="Votre Adresse">
            <button onclick="sendWhatsApp()" class="btn-whatsapp">Commander sur WhatsApp</button>
            <button onclick="toggleCart()">Fermer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
