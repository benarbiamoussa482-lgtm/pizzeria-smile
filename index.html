
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>PIZZERIA SMILE - Menu</title>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #fff; padding-bottom: 120px; }
        header { background-color: #FFD700; color: #000; padding: 20px; text-align: center; }
        .cat { color: #FFD700; font-size: 1.3em; font-weight: bold; margin: 20px 10px; border-bottom: 2px solid #FFD700; }
        .item { background: #1a1a1a; margin: 5px 10px; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: #FFD700; color: #000; border: none; padding: 5px 12px; border-radius: 5px; font-weight: bold; }
        #cart { background: #222; margin: 20px; padding: 15px; border-radius: 10px; border: 1px solid #FFD700; position: sticky; bottom: 10px; }
        .whatsapp-btn { display: block; text-align: center; background-color: #25D366; color: white; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <header><h1>🍕 PIZZERIA SMILE</h1></header>

    <div class="cat">PIZZAS</div>
    <div class="item"><span>Margherita</span><button class="btn-add" onclick="add('Margherita')">+</button></div>
    <div class="item"><span>Royale</span><button class="btn-add" onclick="add('Royale')">+</button></div>
    <div class="item"><span>4 Saisons</span><button class="btn-add" onclick="add('4 Saisons')">+</button></div>
    <div class="item"><span>Smile</span><button class="btn-add" onclick="add('Smile')">+</button></div>

    <div class="cat">SANDWICHS</div>
    <div class="item"><span>Poulet Haché</span><button class="btn-add" onclick="add('Poulet Haché')">+</button></div>
    <div class="item"><span>Chawarma</span><button class="btn-add" onclick="add('Chawarma')">+</button></div>
    <div class="item"><span>Crispy</span><button class="btn-add" onclick="add('Crispy')">+</button></div>

    <div class="cat">TACOS</div>
    <div class="item"><span>Tacos Poulet</span><button class="btn-add" onclick="add('Tacos Poulet')">+</button></div>
    <div class="item"><span>Tacos Mixte</span><button class="btn-add" onclick="add('Tacos Mixte')">+</button></div>

    <div id="cart">
        <h3>Votre Commande 🛒</h3>
        <ul id="cart-list"><li>Panier vide</li></ul>
        <a href="#" id="order-link" class="whatsapp-btn">Commander par WhatsApp</a>
    </div>

    <script>
        let cart = [];
        function add(item) {
            cart.push(item);
            document.getElementById('cart-list').innerHTML = cart.map(i => `<li>${i}</li>`).join('');
            document.getElementById('order-link').href = "https://wa.me/213775077197?text=Bonjour, je voudrais commander: " + cart.join(', ');
        }
    </script>
</body>
</html>
