<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIZZERIA SMILE | Menu</title>
    <style>
        /* تم تعديل الألوان هنا */
        :root { 
            --primary: #1e3a8a; /* أزرق ملكي */
            --accent: #fbbf24;  /* ذهبي مشرق */
            --bg: #0f172a;      /* أزرق داكن جداً للخلفية */
            --text: #ffffff;
        }

        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 200px; }
        header { background: var(--primary); padding: 25px; text-align: center; border-bottom: 4px solid var(--accent); }
        .cat { color: var(--accent); font-size: 1.3em; font-weight: bold; margin: 25px 15px 10px; border-left: 4px solid var(--accent); padding-left: 10px; }
        .item { background: #1e293b; margin: 8px 15px; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .name { font-weight: bold; }
        .sizes { font-size: 0.85em; color: #94a3b8; margin-top: 4px; }
        .btn-add { background: var(--accent); color: #000; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #cart { background: #1e293b; margin: 20px; padding: 15px; border-radius: 10px; border: 2px solid var(--accent); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
        .whatsapp-btn { display: block; text-align: center; background-color: #25D366; color: white; padding: 12px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <header><h1>🍕 PIZZERIA SMILE</h1></header>

    <!-- باقي الأصناف تظل كما هي في الكود السابق -->
    <div class="cat">PIZZAS</div>
    <div class="item"><div><div class="name">Margherita</div><div class="sizes">M:250 | L:500 | XL:1000</div></div><button class="btn-add" onclick="add('Pizza Margherita')">+</button></div>
    
    <!-- يمكنك إضافة باقي القائمة بنفس التنسيق أعلاه -->

    <div id="cart">
        <div style="font-weight:bold; margin-bottom:5px;">Votre Commande 🛒</div>
        <ul id="cart-list" style="margin:5px 0; padding-left:20px; font-size:0.9em;"><li>Panier vide</li></ul>
        <a href="#" id="order-link" class="whatsapp-btn">Commander par WhatsApp</a>
    </div>

    <script>
        let cart = [];
        function add(item) {
            cart.push(item);
            document.getElementById('cart-list').innerHTML = cart.map(i => `<li>${i}</li>`).join('');
            document.getElementById('order-link').href = "https://wa.me/213775077197?text=Commande: " + cart.join(', ');
        }
    </script>
</body>
</html>
