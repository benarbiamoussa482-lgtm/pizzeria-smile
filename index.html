<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Smile - Menu</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .navbar { background: #fff; padding: 20px; text-align: center; font-weight: bold; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .cat-card { background: #fff; padding: 20px; text-align: center; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .food-item { background: white; padding: 15px; margin: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        #cart-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); color:white; padding:20px; overflow-y:auto; }
        input { width: 90%; padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">PIZZERIA SMILE</div>
    <div style="text-align:center; padding:10px;"><button onclick="toggleCart()">🛒 السلة (<span id="cart-count">0</span>)</button></div>

    <section class="category-grid" id="cat-section">
        <!-- الأزرار ستظهر هنا -->
    </section>

    <div id="menu-container"></div>

    <!-- نافذة السلة -->
    <div id="cart-modal">
        <h2>قائمة طلباتك</h2>
        <div id="cart-items"></div>
        <h3>المجموع: <span id="cart-total">0</span> DA</h3>
        <input type="text" id="client-name" placeholder="الاسم الكامل">
        <input type="tel" id="client-phone" placeholder="رقم الهاتف">
        <input type="text" id="client-address" placeholder="العنوان">
        <br><br>
        <button onclick="sendWhatsApp()">إرسال الطلب عبر واتساب</button>
        <button onclick="toggleCart()">إغلاق</button>
    </div>

       
    <script> 
const menu = {
    pizzas: [
        { name: "Pizza Marguerite", prices: { M: 250, L: 500, XL: 1000 } },
        { name: "Pizza Royale", prices: { M: 350, L: 700, XL: 1300 } },
        { name: "Pizza Viande", prices: { M: 400, L: 800, XL: 1500 } },
        { name: "Pizza Poulet", prices: { M: 450, L: 900, XL: 1800 } },
        { name: "Pizza Sicilienne", prices: { M: 500, L: 1000, XL: 1900 } },
        { name: "Pizza Végétarien", prices: { M: 500, L: 1000, XL: 1900 } },
        { name: "Pizza Napolliaine", prices: { M: 550, L: 1100, XL: 2100 } },
        { name: "Pizza Romaine", prices: { M: 600, L: 1200, XL: 2200 } },
        { name: "Pizza Boisé", prices: { M: 650, L: 1300, XL: 2300 } },
        { name: "Pizza 4 Saison", prices: { M: 700, L: 1400, XL: 2400 } },
        { name: "Pizza 4 Fromage", prices: { M: 700, L: 1400, XL: 2400 } },
        { name: "Pizza Compioné", prices: { M: 650, L: 1300, XL: 2400 } },
        { name: "Pizza Chef", prices: { M: 700, L: 1400, XL: 2500 } },
        { name: "Pizza Fumée", prices: { M: 700, L: 1400, XL: 2600 } },
        { name: "Pizza Smile", prices: { M: 800, L: 1600, XL: 2600 } },
        { name: "Pizza Couvert", prices: { M: 800, L: 1600 } },
        { name: "Pizza Venesia", prices: { M: 900, L: 1800 } },
        { name: "Pizza Capriccioza", prices: { M: 1000, L: 1900 } },
        { name: "Pizza Crevette", prices: { M: 1000, L: 2000 } }
    ],
    sandwichs: [
        { name: "Poulet hachée", price: 200 },
        { name: "Spécial", price: 250 },
        { name: "Spécial Doublé", price: 350 },
        { name: "Chawarma", price: 350 },
        { name: "Mariné", price: 350 },
        { name: "Viande Haché", price: 350 },
        { name: "Libané", price: 400 },
        { name: "Kebda", price: 400 },
        { name: "Escalope à la crème", price: 450 },
        { name: "Mexicain", price: 450 },
        { name: "Smile", price: 450 },
        { name: "Crispy", price: 550 },
        { name: "Chessy Chiken", price: 600 },
        { name: "Mortadella", price: 650 },
        { name: "Chiken & Crevette", price: 650 },
        { name: "Chessy Smile", price: 650 }
    ],
    tacos: [
        { name: "Tacos Poulet", prices: { M: 500, L: 650 } },
        { name: "Tacos Chawarma", prices: { M: 500, L: 650 } },
        { name: "Tacos Viande", prices: { M: 600, L: 750 } },
        { name: "Tacos Mixte", prices: { M: 650, L: 800 } },
        { name: "Tacos Crispé", prices: { M: 650, L: 800 } },
        { name: "Gratiné", price: 100 }
    ],
    burger: [
        { name: "Burger", price: 250 },
        { name: "Cheese Burger", price: 350 },
        { name: "Big Burger", price: 400 },
        { name: "Crispy Burger", price: 450 },
        { name: "Burger mixte", price: 550 }
    ],
    gratinés: [
        { name: "Gratiné Poulet", price: 500 },
        { name: "Gratiné Viande", price: 600 },
        { name: "Gratiné Mixte", price: 650 }
    ],
    poutine: [
        { name: "Poulet pané", price: 650 },
        { name: "Mariné", price: 650 },
        { name: "Mixte", price: 800 },
        { name: "Chiken & Crevette", price: 800 }
    ],
    salade: [
        { name: "Salade Smile", price: 600 }
    ]
};
 let cart = [];

        function init() {
            const grid = document.getElementById('cat-section');
            for(let cat in menu) {
                grid.innerHTML += `<div class="cat-card" onclick="showCategory('${cat}')">${cat.toUpperCase()}</div>`;
            }
        }

        function showCategory(cat) {
            const container = document.getElementById('menu-container');
            container.innerHTML = `<h2 style="text-align:center;">${cat.toUpperCase()}</h2>`;
            menu[cat].forEach(item => {
                let priceHtml = item.prices ? `<select id="s-${item.name}">${Object.keys(item.prices).map(s => `<option value="${item.prices[s]}">${s}: ${item.prices[s]} DA</option>`).join('')}</select>` : `<span class="p-tag">${item.price} DA</span>`;
                container.innerHTML += `<div class="food-item"><span>${item.name}</span> ${priceHtml} <button onclick="addToCart('${item.name}')">إضافة</button></div>`;
            });
        }

        function addToCart(name) {
            let price = 0;
            const select = document.getElementById(`s-${name}`);
            if(select) price = select.value;
            else price = menu[Object.keys(menu).find(k => menu[k].find(i=>i.name==name))].find(i=>i.name==name).price;
            cart.push({name, price});
            document.getElementById('cart-count').innerText = cart.length;
            alert("تمت الإضافة!");
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
            let itemsDiv = document.getElementById('cart-items');
            itemsDiv.innerHTML = "";
            let total = 0;
            cart.forEach(i => {
                itemsDiv.innerHTML += `<p>${i.name} - ${i.price} DA</p>`;
                total += parseInt(i.price);
            });
            document.getElementById('cart-total').innerText = total;
        }

        function sendWhatsApp() {
            let msg = `طلب: ${cart.map(i=>i.name).join(', ')} | الاسم: ${document.getElementById('client-name').value} | الهاتف: ${document.getElementById('client-phone').value} | العنوان: ${document.getElementById('client-address').value} | المجموع: ${document.getElementById('cart-total').innerText}`;
            window.location.href = `https://wa.me/0779805210?text=${encodeURIComponent(msg)}`;
        }

        init();
    </script>
</body>
</html>
