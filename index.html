<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Smile - بيتزا وساندويشات فاخرة | قائمة الطلبات</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Pizzeria Smile - أفضل مطعم بيتزا، ساندويشات، تاكو، وبرغر. اطلب وجبتك الآن عبر الموقع واستلمها ساخنة. هاتف: 0779805210">
    <meta name="keywords" content="Pizzeria Smile, بيتزا, تاكو, برغر, ساندويشات, مطعم بيتزا, طلبات بيتزا, توصيل سريع">
    <meta name="author" content="Pizzeria Smile">
    
    <!-- Open Graph (Facebook / WhatsApp Preview) -->
    <meta property="og:title" content="Pizzeria Smile - Le Goût Qui Vous Fait Sourire">
    <meta property="og:description" content="اكتشف القائمة الكاملة واطلب وجبتك المفضلة مباشرة عبر الواتساب!">
    <meta property="og:type" content="website">

    <!-- Schema.org for Google Search Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Pizzeria Smile",
      "description": "Pizzas, Burgers, Sandwichs et plus livrés chauds chez vous!",
      "telephone": "+213779805210",
      "priceRange": "$$",
      "servesCuisine": ["Pizza", "Fast Food", "Sandwiches"]
    }
    </script>

    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="logo">PIZZERIA <span>SMILE</span></div>
        <button class="cart-trigger" onclick="toggleCartModal()">
            🛒 السلة <span id="cart-count">0</span>
        </button>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <h1>LE GOÛT QUI VOUS FAIT SOURIRE</h1>
        <p>أطيب البيتزا، الساندويشات، والتاكو تُحضّر لك بكل حب وتسلم ساخنة 🍕🍔</p>
    </header>

    <!-- Category Filters -->
    <div class="categories-wrapper">
        <div class="category-grid">
            <div class="cat-card active" onclick="filterCategory('all', this)">⭐ الكل</div>
            <div class="cat-card" onclick="filterCategory('pizzas', this)">🍕 PIZZAS</div>
            <div class="cat-card" onclick="filterCategory('sandwichs', this)">🥪 SANDWICHS</div>
            <div class="cat-card" onclick="filterCategory('tacos', this)">🌮 TACOS</div>
            <div class="cat-card" onclick="filterCategory('burger', this)">🍔 BURGERS</div>
            <div class="cat-card" onclick="filterCategory('plats', this)">🍽️ PLATS</div>
            <div class="cat-card" onclick="filterCategory('gratinés', this)">🍲 GRATINÉS</div>
            <div class="cat-card" onclick="filterCategory('poutine', this)">🍟 POUTINES</div>
            <div class="cat-card" onclick="filterCategory('salade', this)">🥗 SALADE</div>
        </div>
    </div>

    <!-- Main Menu Display -->
    <main class="menu-section" id="menu-display">
        <!-- Rendered via JavaScript -->
    </main>

    <!-- Shopping Cart Modal -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>سلة الطلبات 🛒</h3>
                <button class="close-btn" onclick="toggleCartModal()">✕</button>
            </div>

            <div id="cart-items-container">
                <!-- Cart Items Rendered Here -->
            </div>

            <div class="total-box">
                <span>المجموع الكلي:</span>
                <span id="cart-total-price">0 DA</span>
            </div>

            <div class="form-group">
                <h4>معلومات التوصيل 🚚</h4>
                <input type="text" id="client-name" class="form-control" placeholder="الاسم الكامل *" required>
                <input type="tel" id="client-phone" class="form-control" placeholder="رقم الهاتف *" required>
                <input type="text" id="client-address" class="form-control" placeholder="العنوان الكامل والتفصيلي *" required>
            </div>

            <button class="checkout-btn" onclick="sendOrderToWhatsApp()">
                إرسال الطلب عبر الواتساب 📲
            </button>
        </div>
    </div>

    <!-- ربط ملف الـ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
