<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Smile | Commande en ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">PIZZERIA <span>SMILE</span></div>
        <div class="cart-btn" onclick="showCart()">🛒 Panier (<span id="cart-count">0</span>)</div>
    </header>

    <div class="menu-container" id="menu">
        <!-- سيتم توليد الأقسام هنا بواسطة الجافا سكريبت -->
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Votre Panier</h2>
            <div id="cart-items"></div>
            <input type="text" id="name" placeholder="Nom complet">
            <input type="text" id="address" placeholder="Adresse">
            <button onclick="sendWhatsApp()">Commander sur WhatsApp</button>
            <button onclick="document.getElementById('modal').style.display='none'">Fermer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
